<style>
:root{
  --bg:#F4EFE6;
  --bg-alt:#ECE5D8;
  --surface:#F4EFE6;
  --ink:#2E2722;
  --muted:#574C43;
  --rule:#D9CFC0;
  --accent:#C8622F;
  --accent-strong:#A94F24;
  --accent-ink:#ffffff;
  --gley:#6F7F4E;
  --todo-bg:#EBD9A6;--todo-fg:#6E5410;
  --h-o:#3a2c22;--h-a:#6b3f2a;--h-b:#a8442a;--h-c:#c0623c;
  --p-ap:#5b5650;--p-b:#7f7c74;--p-mot:#b8742f;--p-c:#6f8a80;
  --f-voice:"Kiwi Maru",cursive;
  --f-title:"Zen Maru Gothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-latin:"Nunito Sans","Zen Kaku Gothic New",sans-serif;
  --f-mono:"IBM Plex Mono","Zen Kaku Gothic New",monospace;
  --s-1:.8125rem;--s0:1rem;--s1:1.1875rem;--s2:1.5rem;--s3:2.125rem;--s4:clamp(2.25rem,6vw,3.75rem);
  --wrap:68rem;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:4.5rem;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--s0);line-height:1.9;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit;text-decoration-color:color-mix(in srgb,var(--accent-strong) 40%,transparent);text-underline-offset:.2em}
a:hover{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-title);font-weight:700;line-height:1.35;letter-spacing:.03em;text-wrap:balance;word-break:auto-phrase;margin:0}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:1rem;padding-block:.6rem}
.brand{font-family:var(--f-title);font-weight:700;font-size:var(--s1);text-decoration:none;white-space:nowrap}
.brand small{font-family:var(--f-latin);font-weight:600;font-size:.68em;color:var(--muted);margin-left:.6em}
.nav{display:flex;gap:1.4rem;margin-left:auto;overflow-x:auto;scrollbar-width:none;font-family:var(--f-latin);font-size:.9375rem;font-weight:600;letter-spacing:.02em}
.nav::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;white-space:nowrap;color:var(--ink)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current]{font-weight:700}
.nav a.join{color:var(--accent-strong);font-weight:700}
.nav a.join small{font-family:var(--f-title);font-weight:700;font-size:.68rem;letter-spacing:.1em;color:var(--accent-strong);border:1px solid var(--accent-strong);border-radius:2px;padding:.08em .4em 0 .5em;margin-left:.45em;line-height:1.3;vertical-align:.12em;white-space:nowrap}
@media (max-width:760px){.brand small{display:none}.top .wrap{flex-wrap:wrap;gap:.25rem}.nav{margin-left:0;width:100%;gap:.15rem 1rem;font-size:.875rem;flex-wrap:wrap;overflow:visible}}

/* sections */
section{border-top:1px solid var(--rule)}
section > .wrap{padding-block:clamp(3rem,7vw,5rem)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr);gap:.6rem;margin-bottom:2.2rem;max-width:44rem}
.sec-head h2{font-size:var(--s3)}
.sec-head p{color:var(--muted)}

/* news */
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.4rem}
.tab{font:inherit;font-size:var(--s-1);padding:.4em .9em;border-radius:3px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.tab .mono{color:var(--muted);margin-left:.35em;font-size:.9em}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .mono{color:var(--bg);opacity:.75}
.news-month{font-family:var(--f-mono);font-weight:500;font-size:var(--s1);color:var(--accent-strong);padding:1.4rem 0 .3rem;border-bottom:2px solid var(--accent)}
.news-item{border-bottom:1px solid var(--rule);scroll-margin-top:5rem}
.news-item summary{padding:.7rem 0;cursor:pointer;font-size:.9375rem;line-height:1.7;list-style:none}
.news-item summary::-webkit-details-marker{display:none}
.news-item summary::before{content:"▸";display:inline-block;width:1.2em;color:var(--muted);transition:transform .15s}
details[open] > summary::before{transform:rotate(90deg)}
.news-item > div:first-child,.news-item:not(details){padding:.7rem 0;font-size:.9375rem;line-height:1.7}
.news-highlight{animation:news-flash 2s ease-out}
@keyframes news-flash{0%{background:color-mix(in srgb,var(--accent) 15%,transparent)}100%{background:transparent}}
.kind{display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;white-space:nowrap;min-width:6.2em;padding:.1em .5em;border-radius:3px;margin-right:.6em;flex-shrink:0;vertical-align:middle;background:#F3DCCB;color:#8C3F1C}
.kind-award{background:#EBD9A6;color:#6E5410}
.kind-paper{background:#DCE3C8;color:#3F4F22}
.kind-field{background:#E3D1BD;color:#5E3F28}
.kind-grant{background:#D8DDD5;color:#3E4A44}
.kind-info{background:#E6E1D6;color:#4A4038}
.news-item summary{font-family:var(--f-title);font-weight:700}
.news-body{font-family:var(--f-voice);font-weight:400;font-size:17px;line-height:1.9;padding:0 0 1.2rem 1.2em}
.news-date{font-family:var(--f-mono);color:var(--muted);font-size:var(--s-1);margin-bottom:.6rem}
.news-body > p{margin-bottom:.6rem}
.news-photos{margin-top:.8rem}
.news-photos figure{margin:0}
.news-photos img{border-radius:4px;width:100%}
.news-img-placeholder{aspect-ratio:3/2;width:100%;border-radius:4px;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;font-size:var(--s-1);color:var(--muted)}
.news-photos figcaption{font-size:var(--s-1);color:var(--muted);margin-top:.3rem}
.news-photos.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.news-links{margin-top:.6rem;font-size:var(--s-1)}
.news-links a{margin-right:1rem}

footer{background:var(--ink);color:color-mix(in srgb,var(--bg) 70%,var(--ink));font-size:.72rem}
footer .wrap{padding-block:1.2rem 2rem;border-top:1px solid color-mix(in srgb,var(--bg) 20%,var(--ink))}
</style>

</head>

<main>
<section>
  <div class="wrap">
    <div class="sec-head">
      <h2>ニュース</h2>
      <p>研究や活動にまつわるできごとを新しい順にお知らせしています。学会や論文などの「できごと」と、田んぼや畑や森へ出かけた「フィールド」の記録に分けて見られます。</p>
    </div>
    <div class="tabs" id="news-tabs" role="tablist"></div>
    <div id="news-list"></div>
  </div>
</section>
</main>
<footer><div class="wrap">© Makoto Shibata · Kyoto University</div></footer>

<script src="news.js"></script>
<script>
  // #field で来たら「フィールド」タブ、記事IDで来たら「すべて」（どの記事でも開けるように）
  var h = location.hash.slice(1);
  var initial = (h === "field") ? "field" : (h === "other") ? "other" : "all";
  if (h === "field" || h === "other") history.replaceState(null, "", location.pathname + location.search);
  renderNewsAll("news-list", initial, "news-tabs");
</script>
